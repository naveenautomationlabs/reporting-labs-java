name: Release to Maven Central

# Fires on any tag that looks like a semver release (v0.1.0, v1.2.3, …).
# The tag is expected to point at a commit whose parent pom has the matching
# release version already set — the release runbook in PUBLISHING.md shows
# the exact sequence.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          # setup-java can wire up GPG and a settings.xml for us.
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: mvn-${{ hashFiles('**/pom.xml') }}
          restore-keys: mvn-

      - name: Publish
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE:   ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -Prelease -DskipTests clean deploy
